[project]
name = "magicdub-cli"
version = "0.1.2"
description = "Local CLI video dubbing pipeline (no lip-sync)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MagicDub" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-ulid>=2.0",
  "fal-client>=0.5",
]

[project.scripts]
magicdub = "magicdub_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magicdub_cli"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
